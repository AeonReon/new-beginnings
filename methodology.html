<body class="method-page">
  <main id="root" class="method-main"></main>

  <script src="assets/methods-data.js"></script>
  <script src="assets/videos-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const SUB_ICONS = {
      compass: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4"/><polygon points="32,16 38,32 32,48 26,32" fill="currentColor"/>',
      sun: '<circle cx="32" cy="32" r="12" fill="currentColor"/><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><line x1="32" y1="8" x2="32" y2="16"/><line x1="32" y1="48" x2="32" y2="56"/><line x1="8" y1="32" x2="16" y2="32"/><line x1="48" y1="32" x2="56" y2="32"/><line x1="14" y1="14" x2="20" y2="20"/><line x1="44" y1="44" x2="50" y2="50"/><line x1="14" y1="50" x2="20" y2="44"/><line x1="44" y1="20" x2="50" y2="14"/></g>',
      hand: '<path d="M20 36 V22 a3 3 0 0 1 6 0 V32 V18 a3 3 0 0 1 6 0 V32 V20 a3 3 0 0 1 6 0 V34 V24 a3 3 0 0 1 6 0 V42 a14 14 0 0 1 -14 14 H26 a8 8 0 0 1 -8 -8 V40 a4 4 0 0 1 2 -4 Z" fill="currentColor"/>',
      book: '<rect x="14" y="14" width="36" height="40" rx="2" fill="currentColor"/><rect x="16" y="16" width="32" height="36" rx="1" fill="white"/><line x1="22" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="2.5"/><line x1="22" y1="32" x2="42" y2="32" stroke="currentColor" stroke-width="2.5"/><line x1="22" y1="40" x2="36" y2="40" stroke="currentColor" stroke-width="2.5"/>',
      sprout: '<path d="M32 54 V30" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M32 30 C 32 18 18 16 14 24 C 18 30 28 30 32 30 Z" fill="currentColor"/><path d="M32 30 C 32 22 46 18 50 24 C 46 30 36 30 32 30 Z" fill="currentColor" opacity="0.7"/>'
    };

    // A distinct glyph per principle — gives every card its own focal point so
    // the eye has a landmark instead of a wall of identical boxes.
    const PRINCIPLE_ICONS = {
      eye: '<path d="M6 32 C 14 20 26 16 32 16 C 38 16 50 20 58 32 C 50 44 38 48 32 48 C 26 48 14 44 6 32 Z" fill="currentColor" opacity="0.9"/><circle cx="32" cy="32" r="9" fill="#fff"/><circle cx="32" cy="32" r="4.5" fill="currentColor"/>',
      shelf: '<rect x="10" y="14" width="44" height="9" rx="2" fill="currentColor"/><rect x="10" y="28" width="44" height="9" rx="2" fill="currentColor" opacity="0.82"/><rect x="10" y="42" width="44" height="9" rx="2" fill="currentColor" opacity="0.64"/><rect x="15" y="16" width="8" height="5" rx="1" fill="#fff" opacity="0.55"/><rect x="15" y="30" width="8" height="5" rx="1" fill="#fff" opacity="0.55"/>',
      clock: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M32 20 V32 L42 38" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
      broom: '<line x1="42" y1="12" x2="26" y2="36" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M14 52 L26 32 L40 40 L28 56 Z" fill="currentColor"/><path d="M14 52 L28 56" stroke="#fff" stroke-width="2" opacity="0.5"/><path d="M20 46 L30 51 M24 41 L35 47" stroke="#fff" stroke-width="1.6" opacity="0.5"/>',
      puzzle: '<path d="M14 16 h14 a4 4 0 0 1 8 0 h14 v14 a4 4 0 0 0 0 8 v14 h-14 a4 4 0 0 0 -8 0 h-14 v-14 a4 4 0 0 1 0 -8 Z" fill="currentColor"/>',
      wave: '<path d="M8 28 Q 20 16 32 28 T 56 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M8 40 Q 20 28 32 40 T 56 40" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.6"/>',
      heart: '<path d="M32 52 C 12 38 10 24 20 18 C 27 14 32 20 32 24 C 32 20 37 14 44 18 C 54 24 52 38 32 52 Z" fill="currentColor"/>'
    };

    // A curated per-point accent palette — the homepage's "joy" mechanic. Each
    // point gets its OWN colour (warm, earthy, harmonious — not a rainbow, not
    // one blue blob) so the eye keeps catching something new as it scrolls. This
    // is what makes the launcher fun; we bring it to the reading pages.
    const PRINCIPLE_ACCENTS = [
      { c: '#C2410C', cd: '#9A3412', cs: '#FBE9DF' }, // terracotta
      { c: '#B45309', cd: '#8A4008', cs: '#FAEEDB' }, // amber / ochre
      { c: '#0E7490', cd: '#0B5563', cs: '#DEF0F3' }, // teal
      { c: '#4D7C0F', cd: '#3F6212', cs: '#EAF2D9' }, // olive
      { c: '#7C4D9A', cd: '#5E3A78', cs: '#F0E8F6' }, // grape
      { c: '#2563A8', cd: '#1B4C82', cs: '#E3ECF7' }, // blue
      { c: '#B83A6E', cd: '#8E2A54', cs: '#F8E5ED' }  // rose
    ];
    // Which glyph fronts each section on the landing "Read on" list.
    const SECTION_ICON = { 'core-idea': 'compass', 'day-in-life': 'sun', 'activities': 'hand', 'bring-it-home': 'sprout', 'set-up-the-space': 'shelf', 'running-it': 'clock', 'your-part': 'heart', 'reading-list': 'book', 'competency': 'sun' };

    // NOTE: 'core-idea' is intentionally NOT in this list — the landing page IS
    // the core ideas now (the drop-down list). The old core-idea sub-page still
    // renders for direct ?s=core-idea links, it just has no button. 'bring-it-home'
    // is the new "how to actually do this at home" section.
    const SECTION_ORDER = ['day-in-life', 'activities', 'bring-it-home', 'set-up-the-space', 'running-it', 'your-part', 'reading-list', 'competency'];
    const SECTION_META = {
      'core-idea':   { n: '01', title: 'Core idea',            tag: 'The philosophy in plain language, with the why' },
      'day-in-life': { n: '02', title: 'A day in the life',    tag: 'What a typical day looks like at this age' },
      'activities':  { n: '03', title: 'Things to do this week', tag: 'Real things to do — pick one or two' },
      'bring-it-home': { n: '04', title: 'Bring it home',       tag: 'Build your own version — the apps, tools and how to start' },
      'set-up-the-space': { n: '05', title: 'Set up the space',  tag: 'The room, the shopping list, and what to think about first' },
      'running-it':  { n: '06', title: 'Running the day',       tag: 'For whoever leads it — the tone, the rhythm, the adult\'s job' },
      'your-part':   { n: '07', title: 'Your part in it',       tag: 'Stay or drop off, before and after, what to ask on a visit' },
      'reading-list':{ n: '08', title: 'Reading list',         tag: 'Books for you, and books to share' },
      'competency':  { n: '09', title: 'What to expect',        tag: 'Landmarks to orient by, not a test' }
    };

    // ── Age stages (defined BEFORE the main flow — a const-before-use TDZ here
    // once blanked the whole page). v1 content is Early Years (3–6). The
    // philosophy/method (core ideas, the story, Bring it home) is evergreen and
    // shows at every age; only the day, activities, book list and milestones are
    // age-specific and get added stage by stage. We build the METHOD, not a
    // curriculum — enough for a parent to find their child's own level. ──────────
    const STAGES = [
      { id: '3-6',  label: 'Early years', sub: '3–6' },
      { id: '6-9',  label: 'School age',  sub: '6–9' },
      { id: '9-12', label: 'Older child', sub: '9–12' }
    ];
    const DEFAULT_STAGE = '3-6';
    const AGE_SPECIFIC = new Set(['day-in-life', 'activities', 'reading-list', 'competency']);
    function getStage() { try { return localStorage.getItem('nb-stage') || DEFAULT_STAGE; } catch { return DEFAULT_STAGE; } }
    function setStage(s) { try { localStorage.setItem('nb-stage', s); } catch {} }
    // Resolve a section's content for the chosen stage. Evergreen sections and
    // Early Years use m.sections[key]; other stages use m.stages[stage][key].
    const stageIdx = (id) => STAGES.findIndex(s => s.id === id);
    // Some approaches are genuinely designed only for the early years (e.g. Reggio
    // Emilia is a birth-to-six approach). Rather than invent school-age content it
    // doesn't have, a tradition can set `cappedStage` and any older stage is gated
    // off with an honest note. We don't push what doesn't help.
    const stageCapped = (m, stage) => !!(m && m.cappedStage && stageIdx(stage) > stageIdx(m.cappedStage));
    function getSection(m, key, stage) {
      if (!AGE_SPECIFIC.has(key) || stage === DEFAULT_STAGE) return m.sections && m.sections[key];
      if (stageCapped(m, stage)) return null;
      return m.stages && m.stages[stage] && m.stages[stage][key];
    }
    function sectionReady(m, key, stage) { return !!getSection(m, key, stage); }

    // Copywriter's marker — highlight the key idea in each block so the eye lands
    // on what matters instead of wading through a wall of text.
    const HL_TERMS = ['mastery-based', 'one-to-one', 'love of learning', 'growth mindset', 'the whole child', 'the prepared environment', 'living books', 'short lessons', 'follow the child', 'phonological awareness', 'working memory', 'fine motor', 'pincer grip', 'hand strength', 'self-control', 'problem-solving', 'out of doors', 'free play', 'two hours a day', 'top 1–2%', 'narration', 'mastery', 'independence', 'resilience', 'curiosity', 'wonder', 'limitless', 'imagination'].sort((a, b) => b.length - a.length);
    const HL_RE = new RegExp('(' + HL_TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    const hl = (str) => String(str == null ? '' : str).replace(HL_RE, '<mark class="hl">$1</mark>');
    // Bold a short opening HOOK — up to the first em-dash or sentence end.
    const leadHtml = (text) => {
      const s = String(text == null ? '' : text).trim();
      const m = s.match(/^([\s\S]{12,82}?)(\s—\s|[.!?]\s+)([\s\S]+)$/);
      if (!m) return hl(s);
      const dash = m[2].indexOf('—') !== -1;
      const leadText = dash ? m[1] : (m[1] + m[2].trim());
      const sep = dash ? m[2] : ' ';
      return '<span class="lead">' + hl(leadText) + '</span>' + sep + hl(m[3]);
    };
    // Break long text into short, breathing paragraphs (1–2 sentences each),
    // bolding the hook of the first one. This is what kills the "gray blob".
    const multiPara = (text, per) => {
      const s = String(text == null ? '' : text).trim();
      const sents = s.match(/[^.!?]+[.!?]+(?:["'”’)\]]*)(?:\s+|$)/g) || [s];
      per = per || 2;
      const groups = [];
      for (let i = 0; i < sents.length; i += per) groups.push(sents.slice(i, i + per).join('').trim());
      return groups.map((g, i) => i === 0 ? '<p>' + leadHtml(g) + '</p>' : '<p>' + hl(g) + '</p>').join('');
    };

    // ── Shared furniture for the three "how to actually run it" pages ──────
    // (Set up the space / Running the day / Your part in it.) Those pages are
    // long, and as one column of white cards they read as a single grey block.
    // Two mechanics fix it, both lifted from the activities page: every
    // crosshead becomes a tinted BAND with its own accent + emoji, and every
    // long list becomes tap-to-open drop-down bars. Defined here — ABOVE the
    // render calls — because a const-before-use once blanked this whole page.

    // Bands: each one takes the next accent in PRINCIPLE_ACCENTS, so the eye
    // gets a new colour every time it scrolls into a new part of the page.
    const suBands = () => {
      const list = [];
      const add = (emo, title, inner, opts) => {
        if (!inner) return '';
        opts = opts || {};
        const i = list.length;
        const a = PRINCIPLE_ACCENTS[i % PRINCIPLE_ACCENTS.length];
        const bid = 'su-b' + i;
        list.push({ id: bid, emo: emo, short: opts.short || title, a: a });
        return `<section class="su-band" id="${bid}" style="--sc:${a.c};--scd:${a.cd};--scs:${a.cs}">
            <div class="su-band-h">
              <span class="su-band-emo" aria-hidden="true">${emo}</span>
              <span class="su-band-t">${title}</span>
              ${opts.count ? `<span class="su-band-n">${opts.count}</span>` : ''}
            </div>
            ${opts.lead ? `<p class="su-band-lead">${opts.lead}</p>` : ''}
            ${inner}
          </section>`;
      };
      // Quick-nav chips — same component, and the existing .act-chip handler
      // scrolls to the target for free.
      const nav = () => list.length < 2 ? '' : `<div class="act-nav act-nav--su">${list.map(b => `
          <button type="button" class="act-chip" data-target="${b.id}" style="--gc:${b.a.c};--gcd:${b.a.cd}">
            <span class="act-chip-emo" aria-hidden="true">${b.emo}</span>
            <span class="act-chip-lbl">${b.short}</span>
          </button>`).join('')}</div>`;
      // Which accent a band got — so tiles inside it can start from there.
      const at = (i) => PRINCIPLE_ACCENTS[i % PRINCIPLE_ACCENTS.length];
      return { add: add, nav: nav, at: at, count: () => list.length };
    };

    // A long list as drop-down bars. o.title/o.body are functions of the item;
    // o.open says how many stay open by default (never ship a bare pane).
    const suTopics = (list, o) => {
      if (!list || !list.length) return '';
      o = o || {};
      const off = o.offset || 0;
      const openN = o.open == null ? 2 : o.open;
      const emos = o.emos && o.emos.length ? o.emos : ['🔹'];
      return `<div class="act-topics">${list.map((x, i) => {
        const a = PRINCIPLE_ACCENTS[(i + off) % PRINCIPLE_ACCENTS.length];
        const kick = o.kicker ? o.kicker(x, i) : '';
        return `<details class="act-topic${o.cls ? ' ' + o.cls : ''}"${i < openN ? ' open' : ''} style="--gc:${a.c};--gcd:${a.cd}">
            <summary class="act-bar">
              <span class="act-bar-photo act-bar-photo--emo"><span class="act-bar-emo" aria-hidden="true">${emos[i % emos.length]}</span></span>
              <span class="act-bar-text">
                ${kick ? `<span class="act-bar-kicker">${kick}</span>` : ''}
                <span class="act-bar-name">${o.title(x, i)}</span>
              </span>
              ${o.pill ? o.pill(x, i) : ''}
              <span class="act-bar-plus" aria-hidden="true"></span>
            </summary>
            <div class="act-topic-body">${o.body(x, i)}</div>
          </details>`;
      }).join('')}</div>`;
    };

    // White tiles inside a band — gradient outline, accent varying per tile.
    const suCards = (list, off) => {
      if (!list || !list.length) return '';
      return `<div class="su-cards">${list.map((x, i) => {
        const a = PRINCIPLE_ACCENTS[(i + (off || 0)) % PRINCIPLE_ACCENTS.length];
        return `<div class="su-card" style="--sc:${a.c};--scd:${a.cd}">
            <div class="su-card-head"><span class="su-card-t">${x.name || x.t}</span>${x.span ? `<span class="su-card-span">${x.span}</span>` : ''}</div>
            <div class="su-card-d">${hl(x.body || x.d)}</div>
          </div>`;
      }).join('')}</div>`;
    };

    const id = new URLSearchParams(location.search).get('id') || 'charlotte-mason';
    const m = window.METHOD_BY_ID(id);
    const root = document.getElementById('root');

    if (!m) {
      root.innerHTML = '<h1>Tradition not found</h1><p><a href="index.html">← Back to home</a></p>';
    } else {
      // ONE cohesive theme across every tradition — the site's own clean blue,
      // not a different loud colour per school. Identity comes from the words and
      // the photo, not from drowning the page in a hue.
      const SITE = { accent: '#2D6FA8', accentBright: '#4FA4D2', accentSoft: '#EAF3FB', warm: '#E0912B' };
      document.title = 'Conscious Parenting NI — ' + m.name;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', SITE.accent);
      document.documentElement.style.setProperty('--m-color', SITE.accent);
      document.documentElement.style.setProperty('--m-deep', SITE.accent);
      document.documentElement.style.setProperty('--m-soft', SITE.accentSoft);

      const subSection = new URLSearchParams(location.search).get('s');

      if (subSection && m.sections && m.sections[subSection]) {
        // Back (top-left, added by app.js) uses browser history — from a
        // sub-section it returns to this tradition's landing, and from the
        // landing it returns to wherever you tapped in (the traditions grid).
        renderSubSection(m, subSection);
      } else {
        renderMethodLanding(m);
      }
    }

    // One curated video per tradition, keyed by tradition id. Facade only —
    // nothing loads from YouTube until the parent actually taps play, so the
    // page stays fast and sets no cookies. See assets/videos-data.js for the
    // selection rule and why two traditions deliberately have none.
    //
    // Read window.VIDEOS at call time, NOT into a `const` up here. These
    // helpers are declared below the code that first calls them, so a const
    // would still be in its temporal dead zone when watchBlock() runs and the
    // whole page would render blank. Function declarations hoist; consts don't.

    // 926165 -> "926K". Real recorded counts, refreshed by scripts/check-videos.mjs.
    function fmtViews(n){
      n = Number(n) || 0;
      if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return Math.round(n / 1e3) + 'K';
      return String(n);
    }

    function watchBlock(m) {
      const v = (window.VIDEOS || {})[m.id];
      if (!v) return '';
      const esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      return `
        <section class="watch" style="--ga:${m.color};--gad:${m.colorDeep};--gas:${m.colorSoft}">
          <div class="watch-head">See it for yourself</div>
          <div class="watch-card">
            <button type="button" class="watch-play" data-vid="${esc(v.id)}" aria-label="Play: ${esc(v.title)}">
              <img src="https://i.ytimg.com/vi/${esc(v.id)}/maxresdefault.jpg" alt="" loading="lazy"
                   onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'">
              <span class="watch-btn"></span>
              ${v.mins ? `<span class="watch-len">${esc(v.mins)}</span>` : ''}
            </button>
            <div class="watch-tt">
              <div class="watch-name">${esc(v.title)}</div>
              <div class="watch-meta">${esc(v.channel)}${v.views ? ` <span>· ${fmtViews(v.views)} views</span>` : ''}</div>
              ${v.why ? `<p class="watch-why">${esc(v.why)}</p>` : ''}
              ${v.note ? `<div class="watch-note"><b>Worth knowing:</b> ${esc(v.note)}</div>` : ''}
              <a class="watch-out" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">Watch on YouTube ↗</a>
            </div>
          </div>
        </section>`;
    }

    function renderMethodLanding(m) {
      const stage = getStage();
      const capped = stageCapped(m, stage);
      // Show the "being written" note only when this stage is still incomplete
      // for THIS tradition — once its age-specific sections exist, drop it.
      const stageIncomplete = !capped && stage !== DEFAULT_STAGE && [...AGE_SPECIFIC].some(k => !sectionReady(m, k, stage));
      const capSub = (STAGES.find(s => s.id === m.cappedStage) || {}).sub || '3–6';
      const toc = SECTION_ORDER.map((key, idx) => {
        const built = sectionReady(m, key, stage);
        const meta = SECTION_META[key];
        const a = PRINCIPLE_ACCENTS[idx % PRINCIPLE_ACCENTS.length];
        const glyph = SUB_ICONS[SECTION_ICON[key]] || '';
        return `
          <a class="toc-row${built ? '' : ' toc-stub'}" style="--tc:${a.c};--tcd:${a.cd};--tcs:${a.cs}" ${built ? `href="methodology.html?id=${m.id}&s=${key}"` : ''}>
            <span class="toc-badge"><svg viewBox="0 0 64 64" aria-hidden="true">${glyph}</svg></span>
            <span class="toc-text">
              <span class="toc-name">${meta.title}</span>
              <span class="toc-tag">${meta.tag}</span>
            </span>
            ${built ? '<span class="toc-arrow" aria-hidden="true">→</span>' : (capped && AGE_SPECIFIC.has(key) ? `<span class="toc-soon">Ages ${capSub}</span>` : '<span class="toc-soon">Soon</span>')}
          </a>`;
      }).join('');

      // SCAN-MODE landing: when a tradition has a `grab` block we lead with the
      // hook, the proof numbers and the bulleted claims — then the options —
      // and only then the narrative, folded away for whoever wants it.
      // Traditions without `grab` keep the original story-first layout.
      const g = m.grab;
      // Dead-simple grabber: the core ideas as a scannable list of bold titles,
      // each a tap-to-open drop-down with a short "what it means".
      const grabber = g ? `
        <section class="grab" style="--ga:${m.color};--gad:${m.colorDeep};--gas:${m.colorSoft}">
          ${g.hook ? `<h2 class="grab-hook">${g.hook}</h2>` : ''}
          ${g.summary ? `<div class="grab-summary">${multiPara(g.summary, 2)}</div>` : ''}
          ${g.deck ? `<p class="grab-deck">${g.deck}</p>` : ''}
          <div class="qa">
            ${g.bullets.map((b, i) => `
              <details class="qa-item">
                <summary>
                  <span class="qa-num">${i + 1}</span>
                  <span class="qa-t">${b.t}</span>
                  <span class="qa-plus" aria-hidden="true"></span>
                </summary>
                <div class="qa-d"><p>${hl(b.d)}</p></div>
              </details>`).join('')}
          </div>
        </section>` : '';

      const storyBlock = g ? `
        <details class="story">
          <summary>
            <span class="story-emo" aria-hidden="true">📖</span>
            <span class="story-txt">
              <span class="story-name">The full story</span>
              <span class="story-sub">Where ${m.name} came from, and how it actually works</span>
            </span>
            <span class="story-chev" aria-hidden="true">▾</span>
          </summary>
          <div class="story-body">${g.story ? g.story.map(p => `<p>${hl(p)}</p>`).join('') : multiPara(m.blurb, 2)}</div>
        </details>` : '';

      // The School of Light is the one tradition here that is a real, live place you can
      // actually join — so its page leads with the way in, before the philosophy.
      const siteCta = m.website ? `
        <a class="site-cta" href="${m.website.url}" target="_blank" rel="noopener">
          <span class="site-cta-mark" aria-hidden="true"></span>
          <span class="site-cta-txt">
            <span class="site-cta-label">${m.website.label}</span>
            <span class="site-cta-line">${m.website.line}</span>
            <span class="site-cta-go">Visit the website →</span>
          </span>
        </a>` : '';

      root.innerHTML = `
        <article class="ed-article">
          <div class="ed-eyebrow">${m.era}</div>
          <h1 class="ed-title">${m.name}</h1>
          <p class="ed-deck">${m.tagline}</p>
          ${siteCta}
          ${m.image ? `<figure class="ed-hero"><img src="${m.image}" alt="${m.name}"></figure>` : ''}
          ${g ? grabber : `<div class="ed-lead">${multiPara(m.blurb, 2)}</div>`}
          ${(!g && m.promise) ? `
          <aside class="ed-promise">
            <div class="ed-promise-label">In one breath</div>
            <p class="ed-promise-line">${m.promise}</p>
            ${m.essence ? `<ul class="ed-essence">${m.essence.map(e => `<li>${e}</li>`).join('')}</ul>` : ''}
          </aside>` : ''}
          ${m.noStages ? '' : `
          <div class="stage-head">For your child's age</div>
          <div class="stage-pick" role="group" aria-label="Your child's age">
            ${STAGES.map(st => `<button type="button" class="stage-btn${st.id === stage ? ' active' : ''}" data-stage="${st.id}"><span class="stage-lbl">${st.label}</span><span class="stage-sub">${st.sub}</span></button>`).join('')}
          </div>
          ${capped ? `<p class="stage-note">${m.name} is an approach for the <b>early years</b> — about ${capSub}. There isn't an honest school-age version to teach, so we don't invent one. The ideas above still travel with you: carry them into whichever approach you choose for the older years.</p>` : ''}
          ${stageIncomplete ? `<p class="stage-note">The ideas and the method are the same at every age — read them above, and in <b>Bring it home</b>. The day, the activities, the book list and the milestones for <b>${STAGES.find(s => s.id === stage).sub}</b> are being written next.</p>` : ''}
          <div class="ed-toc-head">${g ? 'Explore it' : 'Read on'}</div>
          <nav class="ed-toc">${toc}</nav>`}
          ${watchBlock(m)}
          ${storyBlock}
        </article>
      `;
      root.querySelectorAll('.stage-btn').forEach(b => b.addEventListener('click', () => { setStage(b.dataset.stage); renderMethodLanding(m); }));
      // Only now does anything load from YouTube. nocookie domain, and autoplay
      // is allowed because the tap itself is the user gesture iOS requires.
      root.querySelectorAll('.watch-play').forEach(btn => btn.addEventListener('click', () => {
        const f = document.createElement('iframe');
        f.src = 'https://www.youtube-nocookie.com/embed/' + btn.dataset.vid + '?autoplay=1&rel=0&modestbranding=1';
        f.title = btn.getAttribute('aria-label') || 'Video';
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        f.allowFullscreen = true;
        btn.replaceWith(f);
      }));
    }

    function renderSubSection(m, key) {
      const stage = getStage();
      if (AGE_SPECIFIC.has(key) && stageCapped(m, stage)) {
        const capSub = (STAGES.find(s => s.id === m.cappedStage) || {}).sub || '3–6';
        root.innerHTML = `<article class="ed-article"><h1 class="ed-title">${m.name}</h1><p class="ed-deck">An early-years approach</p><p class="stage-note">${m.name} is designed for the early years — about ${capSub}. There isn't an honest school-age version of this section to show. <a href="methodology.html?id=${m.id}">← Back to ${m.name}</a></p></article>`;
        return;
      }
      const s = getSection(m, key, stage) || m.sections[key];
      let body = '';

      if (key === 'core-idea') {
        const two = (n) => String(n).padStart(2, '0');
        // Spread the pull-quotes evenly through the piece so the eye gets a rest
        // between every couple of points, not one lump in the middle.
        const quotes = s.quotes || (s.banner ? [s.banner] : []);
        const n = s.principles.length;
        const quoteBefore = {};
        quotes.forEach((q, qi) => {
          const pos = Math.round((n * (qi + 1)) / (quotes.length + 1));
          quoteBefore[Math.min(Math.max(pos, 1), n - 1)] = q;
        });
        const pullquote = (q) => `<blockquote class="pullquote"><p>${q.text}</p>${q.cite ? `<cite>${q.cite}</cite>` : ''}</blockquote>`;
        // One real photo, placed where it won't clash with a pull-quote.
        let imgAt = -1;
        if (m.image) { for (let k = Math.floor(n / 2); k < n; k++) { if (!quoteBefore[k]) { imgAt = k; break; } } }
        const figure = `<figure class="ed-figure"><img src="${m.image}" alt=""><figcaption>${s.imageCaption || (m.name + ' in practice')}</figcaption></figure>`;
        const tenets = s.principles.map((p, i) => {
          const quote = quoteBefore[i] ? pullquote(quoteBefore[i]) : '';
          const glance = p.looksLike
            ? `<div class="glance"><div class="glance-label">What it looks like</div><ul>${p.looksLike.map(b => `<li>${hl(b)}</li>`).join('')}</ul></div>`
            : '';
          const why = p.why
            ? `<aside class="whybox"><span class="whybox-label">Why it works</span><p>${hl(p.why)}</p></aside>`
            : '';

          // PHOTO-STORY chapter — the principle's own photo IS the banner and
          // the hook is written on it, homepage-hero style. Image-led, not
          // text-led: this is what makes the page a scrolling story.
          if (p.photo) {
            return `${quote}
              <section class="chap">
                <div class="chap-banner">
                  <img src="${p.photo}" alt="" loading="lazy">
                  <div class="chap-ban-in">
                    <div class="chap-kicker"><span class="ck-no">${i + 1}</span>${p.name}</div>
                    <h3 class="chap-hook">${p.hook || p.name}</h3>
                  </div>
                </div>
                <div class="chap-body">
                  ${p.takeaway ? `<p class="chap-take">${hl(p.takeaway)}</p>` : ''}
                  <div class="tenet-body">${multiPara(p.body, 2)}</div>
                  ${glance}
                  ${why}
                  ${p.inPractice ? `<p class="tenet-try"><span class="tt-tag">Try it</span> ${hl(p.inPractice)}</p>` : ''}
                </div>
              </section>`;
          }

          // Fallback for traditions without per-principle photos (unchanged).
          const img = (i === imgAt) ? figure : '';
          const a = PRINCIPLE_ACCENTS[i % PRINCIPLE_ACCENTS.length];
          const badge = (p.icon && PRINCIPLE_ICONS[p.icon])
            ? `<div class="tenet-badge"><svg viewBox="0 0 64 64" aria-hidden="true">${PRINCIPLE_ICONS[p.icon]}</svg></div>`
            : '';
          const kicker = p.hook ? `<div class="tenet-kicker">${p.name}</div>` : '';
          const head = `<div class="tenet-headrow">${badge}<div class="tenet-headtext">${kicker}<h3 class="tenet-head">${p.hook || p.name}</h3></div></div>`;
          return `${quote}${img}
            <section class="tenet" style="--tc:${a.c};--tcd:${a.cd};--tcs:${a.cs}">
              <div class="tenet-bignum" aria-hidden="true">${two(i + 1)}</div>
              ${head}
              ${p.takeaway ? `<p class="tenet-take">${hl(p.takeaway)}</p>` : ''}
              <div class="tenet-body">${multiPara(p.body, 2)}</div>
              ${glance}
              ${why}
              ${p.inPractice ? `<p class="tenet-try"><span class="tt-tag">Try it</span> ${hl(p.inPractice)}</p>` : ''}
            </section>`;
        }).join('');
        const recap = s.recap
          ? `<aside class="recap">
               <div class="recap-label">In short</div>
               <ol>${s.recap.map(r => `<li>${r}</li>`).join('')}</ol>
             </aside>`
          : '';
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${tenets}
          ${recap}
        `;
      } else if (key === 'day-in-life') {
        // A real timeline: a coloured rail, an emoji badge per moment, and
        // day-part banners that break one long list into four short chapters.
        const PARTS = [
          { name: 'Morning',   emo: '🌅', span: 'Wake to midday',   until: 12 * 60,      c: '#B45309', cd: '#8A4008' },
          { name: 'Midday',    emo: '🍽️', span: 'Lunch and outside', until: 14 * 60,     c: '#4D7C0F', cd: '#3F6212' },
          { name: 'Afternoon', emo: '🎨', span: 'Rest and play',    until: 17 * 60 + 30, c: '#0E7490', cd: '#0B5563' },
          { name: 'Evening',   emo: '🌙', span: 'Dinner to bed',    until: 99 * 60,      c: '#5B4A9E', cd: '#42357A' }
        ];
        // Read the first H:MM out of the time label ("7:00", "Monday 8:30").
        const minsOf = (t) => { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; };
        // Emoji fallback so traditions without per-block icons still get one.
        const GUESS = [[/wake|morning|rise/i, '🌅'], [/tidy|clean|chore/i, '🧺'], [/work|lesson|study|cycle/i, '🧩'],
          [/snack/i, '🍎'], [/outside|garden|walk|wood|park/i, '🌳'], [/lunch|meal|dinner|supper|table/i, '🍽️'],
          [/rest|nap|quiet|sleep/i, '😴'], [/play|creative|craft|art/i, '🎨'], [/story|read|book/i, '📖'],
          [/bath|bed|night/i, '🛁'], [/circle|song|sing|verse/i, '🎵'], [/bake|bread|cook|kitchen/i, '🍞']];
        const emoFor = (b) => b.icon || (GUESS.find(([re]) => re.test(b.title + ' ' + b.body)) || [null, '⭐'])[1];

        let cur = -1, out = '', open = false;
        s.timeline.forEach((b) => {
          const mins = minsOf(b.time);
          // only advance to a new part when we can actually read a clock time
          let idx = cur < 0 ? 0 : cur;
          if (mins != null) { idx = PARTS.findIndex(p => mins < p.until); if (idx < 0) idx = PARTS.length - 1; }
          if (idx !== cur) {
            if (open) out += `</div>`;
            const p = PARTS[idx];
            out += `<div class="daypart" style="--dp:${p.c};--dpd:${p.cd}">
                      <span class="daypart-emo" aria-hidden="true">${p.emo}</span>
                      <span class="daypart-name">${p.name}</span>
                      <span class="daypart-span">${p.span}</span>
                    </div>
                    <div class="day-rail" style="--dp:${p.c};--dpd:${p.cd}">`;
            cur = idx; open = true;
          }
          out += `<div class="day-block${b.highlight ? ' is-hero' : ''}">
                    <div class="day-head">
                      <span class="day-badge" aria-hidden="true">${emoFor(b)}</span>
                      <span class="day-time">${b.time}</span>
                      ${b.highlight ? '<span class="day-hero-tag">The heart of the day</span>' : ''}
                    </div>
                    <div class="day-title">${b.title}</div>
                    <div class="day-body">${hl(b.body)}</div>
                  </div>`;
        });
        if (open) out += `</div>`;

        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          <div class="day-timeline">${out}</div>
          ${s.note ? `<p class="note-box">${hl(s.note)}</p>` : ''}
        `;
      } else if (key === 'activities') {
        // Grouped into themed clusters with subheads so a long list reads as a
        // handful of short chapters, not one endless column. Falls back to a
        // single flat group for traditions that haven't been grouped yet.
        const groups = s.groups || [{ items: s.items }];
        const item = (a, n) => `
          <div class="act-item">
            <div class="act-no">${n}</div>
            <div class="act-text">
              <div class="act-name">${a.name}</div>
              <div class="act-body">${hl(a.body)}</div>
            </div>
          </div>`;
        // Each themed group gets its own colour + emoji chapter banner, so a
        // twenty-item list reads as four short lists instead of one long one.
        const GA = [
          { c: '#C2410C', cd: '#9A3412' }, { c: '#0E7490', cd: '#0B5563' },
          { c: '#7C4D9A', cd: '#5E3A78' }, { c: '#4D7C0F', cd: '#3F6212' },
          { c: '#B83A6E', cd: '#8E2A54' }, { c: '#2563A8', cd: '#1B4C82' }
        ];
        const GEMO = ['🏠', '✨', '✍️', '🍎', '🎨', '🌳'];
        const grouped = !!(groups[0] && groups[0].heading);
        // Short chip label — first word or two of the heading, for the quick-nav.
        const shortLbl = (h) => h.split(/[&,]| and /)[0].trim();
        let n = 0;
        // Each themed group becomes a homepage-style BAR (photo left, title right)
        // that opens as a drop-down — so the page is short and you tap what you want.
        const blocks = groups.map((g, gi) => {
          const a = GA[gi % GA.length];
          if (!grouped) {
            const rows = g.items.map(x => item(x, ++n)).join('');
            return `<div class="act-list act-list--flat">${rows}</div>`;
          }
          const emo = g.icon || GEMO[gi % GEMO.length];
          const rows = g.items.map(x => item(x, ++n)).join('');
          const photo = g.photo
            ? `<span class="act-bar-photo" style="background-image:url('${g.photo}')"><span class="act-bar-photo-ov"></span></span>`
            : `<span class="act-bar-photo act-bar-photo--emo"><span class="act-bar-emo" aria-hidden="true">${emo}</span></span>`;
          return `
            <details class="act-topic" id="act-g${gi}" style="--gc:${a.c};--gcd:${a.cd}">
              <summary class="act-bar">
                ${photo}
                <span class="act-bar-text">
                  <span class="act-bar-kicker">${emo} Part ${String(gi + 1).padStart(2, '0')} · ${g.items.length} to try</span>
                  <span class="act-bar-name">${g.heading}</span>
                </span>
                <span class="act-bar-plus" aria-hidden="true"></span>
              </summary>
              <div class="act-topic-body">
                ${g.intro ? `<p class="act-group-intro">${hl(g.intro)}</p>` : ''}
                <div class="act-list">${rows}</div>
              </div>
            </details>`;
        }).join('');
        // Quick-nav: little squares that jump to (and open) a topic.
        const nav = grouped ? `
          <div class="act-nav">${groups.map((g, gi) => {
            const a = GA[gi % GA.length];
            return `<button type="button" class="act-chip" data-target="act-g${gi}" style="--gc:${a.c};--gcd:${a.cd}">
              <span class="act-chip-emo" aria-hidden="true">${g.icon || GEMO[gi % GEMO.length]}</span>
              <span class="act-chip-lbl">${shortLbl(g.heading)}</span>
            </button>`;
          }).join('')}</div>` : '';
        const total = groups.reduce((t, g) => t + g.items.length, 0);
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          <p class="act-nudge"><span class="act-nudge-emo" aria-hidden="true">💡</span>
            <span><b>You are not meant to do all ${total}.</b> Pick one or two that catch your eye — that is the whole method.</span></p>
          ${nav}
          <div class="act-topics">${blocks}</div>
          ${s.quote ? `<blockquote class="pullquote"><p>${s.quote.text}</p>${s.quote.cite ? `<cite>${s.quote.cite}</cite>` : ''}</blockquote>` : ''}
        `;
      } else if (key === 'reading-list') {
        body = `
          <div class="lede">${multiPara(s.intro, 2)}</div>
          <h2>For the child</h2>
          <p>${hl(s.forChild.intro)}</p>
          ${s.forChild.groups.map(g => `
            <div class="card">
              <h3>${g.heading}</h3>
              <ul>${g.books.map(b => `<li>${hl(b)}</li>`).join('')}</ul>
            </div>
          `).join('')}
          <h2>For the parent</h2>
          <p>${hl(s.forParent.intro)}</p>
          <div class="card">
            <ul class="book-list">
              ${s.forParent.books.map(b => `
                <li><strong>${b.title}</strong> — ${b.author}<br><span class="book-note">${hl(b.note)}</span></li>
              `).join('')}
            </ul>
          </div>
          ${s.free ? `<p class="note-box">${hl(s.free)}</p>` : ''}
        `;
      } else if (key === 'competency') {
        body = `
          <div class="lede">${multiPara(s.intro, 2)}</div>
          ${s.landmarks.map(area => `
            <div class="card">
              <h3>${area.area}</h3>
              <ul>${area.items.map(i => `<li>${hl(i)}</li>`).join('')}</ul>
            </div>
          `).join('')}
          ${s.note ? `<p class="note-box">${hl(s.note)}</p>` : ''}
        `;
      } else if (key === 'bring-it-home') {
        // How to actually run a version of this at home: a build-your-own guide,
        // the apps to reach for (with real App Store / Google Play links), and
        // one worth-knowing note about how the school really works.
        const appCard = (a) => `
          <div class="bih-app">
            <div class="bih-app-head">
              <span class="bih-app-name">${a.name}</span>
              <span class="bih-app-price${/free/i.test(a.price) ? ' is-free' : ''}">${a.price}</span>
            </div>
            <div class="bih-app-tag">${hl(a.tag)}</div>
            <div class="bih-app-links">
              ${a.ios ? `<a class="bih-store" href="${a.ios}" target="_blank" rel="noopener"> App Store</a>` : ''}
              ${a.android ? `<a class="bih-store bih-play" href="${a.android}" target="_blank" rel="noopener">▶ Google Play</a>` : ''}
              ${a.site ? `<a class="bih-store bih-site" href="${a.site}" target="_blank" rel="noopener">↗ Website</a>` : ''}
            </div>
          </div>`;
        const kitCard = (k) => `
          <div class="bih-app">
            <div class="bih-app-head"><span class="bih-app-name">${k.name}</span></div>
            <div class="bih-app-tag">${hl(k.tag)}</div>
            ${k.site ? `<div class="bih-app-links"><a class="bih-store bih-site" href="${k.site}" target="_blank" rel="noopener">↗ Where to find it</a></div>` : ''}
          </div>`;
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${s.steps ? `<div class="bih-cross">Build your own version</div>
            <div class="act-topics">${s.steps.map((x, i) => {
              const a = PRINCIPLE_ACCENTS[i % PRINCIPLE_ACCENTS.length];
              const photo = x.photo
                ? `<span class="act-bar-photo" style="background-image:url('${x.photo}')"><span class="act-bar-photo-ov"></span></span>`
                : `<span class="act-bar-photo act-bar-photo--emo"><span class="act-bar-emo" aria-hidden="true">🌱</span></span>`;
              return `<details class="act-topic" style="--gc:${a.c};--gcd:${a.cd}">
                <summary class="act-bar">
                  ${photo}
                  <span class="act-bar-text">
                    <span class="act-bar-kicker">Step ${i + 1}</span>
                    <span class="act-bar-name">${x.t}</span>
                  </span>
                  <span class="act-bar-plus" aria-hidden="true"></span>
                </summary>
                <div class="act-topic-body"><p class="bih-step-d">${hl(x.d)}</p></div>
              </details>`;
            }).join('')}</div>` : ''}
          ${s.apps ? `<div class="bih-cross">The apps to reach for</div>
            <div class="bih-apps">${s.apps.map(appCard).join('')}</div>
            <p class="bih-fine">Free where it says free. Links open the App Store or Google Play — always check what suits your child before downloading.</p>` : ''}
          ${s.kit ? `<div class="bih-cross">What to get, where to start</div>
            <div class="bih-apps">${s.kit.map(kitCard).join('')}</div>` : ''}
          ${s.screens ? `<p class="bih-screens"><span class="bih-screens-ic" aria-hidden="true">📵</span>${hl(s.screens)}</p>` : ''}
          ${s.watch ? `<div class="bih-cross">Worth watching</div><div class="bih-apps">${s.watch.map(appCard).join('')}</div>` : ''}
          ${s.note ? `<aside class="bih-note"><div class="bih-note-label">How their teachers are made</div><p>${hl(s.note)}</p></aside>` : ''}
        `;
      } else if (key === 'set-up-the-space') {
        // The room itself: what it costs, what has to be in it, what to buy,
        // what to think about before you start, and what to leave out. Every
        // crosshead is its own tinted band; the two longest lists (the room,
        // and the things to think about) open on tap so the page stays short.
        const B = suBands();
        const total = (s.shopping || []).reduce((t, g) => t + g.items.length, 0);
        const SHOP_EMO = ['🪵', '🫖', '🔤', '🏫', '🧺', '🧩'];
        const shopBlocks = (s.shopping || []).map((g, gi) => {
          const a = PRINCIPLE_ACCENTS[(gi + 2) % PRINCIPLE_ACCENTS.length];
          const items = g.items.map((it, ii) => `
            <label class="su-item" data-kit="${m.id}:${gi}:${ii}">
              <span class="su-tick" aria-hidden="true">✓</span>
              <span class="su-item-text">
                <span class="su-item-n">${it.name}</span>
                <span class="su-item-tag">${hl(it.tag)}</span>
                ${it.where ? `<a class="su-item-where" href="${it.where}" target="_blank" rel="noopener">↗ Where to find it</a>` : ''}
              </span>
            </label>`).join('');
          return `<details class="act-topic su-shopgroup"${gi === 0 ? ' open' : ''} style="--gc:${a.c};--gcd:${a.cd}">
              <summary class="act-bar">
                <span class="act-bar-photo act-bar-photo--emo"><span class="act-bar-emo" aria-hidden="true">${SHOP_EMO[gi % SHOP_EMO.length]}</span></span>
                <span class="act-bar-text">
                  <span class="act-bar-kicker">List ${String(gi + 1).padStart(2, '0')} · ${g.items.length} things</span>
                  <span class="act-bar-name">${g.heading}</span>
                </span>
                <span class="su-kit-count">0 of ${g.items.length} got</span>
                <span class="act-bar-plus" aria-hidden="true"></span>
              </summary>
              <div class="act-topic-body"><div class="su-shop">${items}</div></div>
            </details>`;
        }).join('');
        const blocks = [
          B.add('📐', 'Three sizes of the same idea', suCards(s.scales, 0),
            { short: 'Three sizes', count: s.scales ? s.scales.length + ' ways' : '' }),
          B.add('👀', 'What you would expect to see', suTopics(s.elements, {
            offset: 1, open: 2, emos: ['🪟', '🪜', '🧺', '🪴', '🧽', '🖼️', '🧩', '🪑', '📚', '🌿'],
            kicker: (x, i) => 'In the room · ' + String(i + 1).padStart(2, '0'),
            title: (x) => x.t, body: (x) => `<p class="su-d">${hl(x.d)}</p>`
          }), { short: 'In the room', count: s.elements ? s.elements.length + ' things' : '', lead: 'Tap any one to read why it is there.' }),
          B.add('🛒', 'The shopping list', shopBlocks,
            { short: 'Shopping', count: total ? total + ' things' : '',
              lead: `Tap an item to tick it off — the list remembers. Nearly half of it is charity-shop or free, so start at the top of each list and stop when the room works.` }),
          B.add('💭', 'Things to think about first', suTopics(s.think, {
            offset: 3, open: 2, emos: ['💡', '🔊', '🚪', '🌡️', '🧭', '🧯', '⏱️', '🪟'],
            title: (x) => x.t, body: (x) => `<p class="su-d">${hl(x.d)}</p>`
          }), { short: 'Think first', count: s.think ? s.think.length + ' to weigh' : '' }),
          B.add('🚫', 'What to leave out', s.avoid ? `<ul class="su-nope">${s.avoid.map(x => `<li>${hl(x)}</li>`).join('')}</ul>` : '',
            { short: 'Leave out', count: s.avoid ? s.avoid.length + ' to skip' : '' })
        ].join('');
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${B.nav()}
          ${blocks}
          ${s.note ? `<p class="note-box">${hl(s.note)}</p>` : ''}
        `;
      } else if (key === 'running-it') {
        // The facilitator's guide — for whoever is leading the day, at home or
        // in a setting. Tone first, because it decides everything after it.
        const B = suBands();
        const blocks = [
          B.add('🕊️', 'The tone you set', suCards(s.tone, 0),
            { short: 'The tone', count: s.tone ? s.tone.length + ' habits' : '' }),
          B.add('🕘', 'What you do, every day', suTopics(s.rhythm, {
            offset: 1, open: 2, emos: ['🌅', '🧹', '🤫', '👀', '🍎', '🧺', '📖', '🎵', '🌤️', '🌙', '✨'],
            kicker: (x, i) => 'Step ' + String(i + 1).padStart(2, '0'),
            title: (x) => x.t, body: (x) => `<p class="su-d">${hl(x.d)}</p>`
          }), { short: 'Every day', count: s.rhythm ? s.rhythm.length + ' steps' : '', lead: 'The whole day in order. Tap a step to see what it actually involves.' }),
          B.add('🎯', 'The adult\'s job', (s.does || s.doesnt) ? `<div class="su-pair">
              ${s.does ? `<div class="su-pane is-do"><div class="su-pane-h">What the adult does</div><ul>${s.does.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div>` : ''}
              ${s.doesnt ? `<div class="su-pane is-dont"><div class="su-pane-h">What the adult does not do</div><ul>${s.doesnt.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div>` : ''}
            </div>` : '', { short: 'The job' }),
          B.add('👪', 'Where the parents fit', s.parents ? `<div class="su-prose">${multiPara(s.parents, 2)}</div>` : '',
            { short: 'Parents' }),
          B.add('⚠️', 'Where it usually goes wrong', suTopics(s.mistakes, {
            offset: 4, open: 2, emos: ['⏱️', '📋', '🧸', '🗣️', '🎯', '🧩'],
            title: (x) => x.t, body: (x) => `<p class="su-d">${hl(x.d)}</p>`
          }), { short: 'Goes wrong', count: s.mistakes ? s.mistakes.length + ' traps' : '' })
        ].join('');
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${B.nav()}
          ${blocks}
          ${s.training ? `<aside class="bih-note"><div class="bih-note-label">Training, and what it takes to open</div><p>${hl(s.training)}</p></aside>` : ''}
        `;
      } else if (key === 'your-part') {
        // The parent's side: stay or drop off, what to do before and after, and
        // what to ask when you go and look at a place.
        const B = suBands();
        const blocks = [
          B.add('🤝', 'How this one works', s.model ? `<div class="su-cards"><div class="su-card" style="--sc:${PRINCIPLE_ACCENTS[0].c};--scd:${PRINCIPLE_ACCENTS[0].cd}">
              <div class="su-card-head"><span class="su-card-t">${s.model.label}</span></div>
              <div class="su-card-d">${hl(s.model.body)}</div>
            </div></div>` : '', { short: 'How it works' }),
          B.add('🌅', 'The morning, and the pick-up', (s.before || s.after) ? `<div class="su-pair">
              ${s.before ? `<div class="su-pane is-do"><div class="su-pane-h">Before they go</div><ul>${s.before.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div>` : ''}
              ${s.after ? `<div class="su-pane is-do"><div class="su-pane-h">When you collect them</div><ul>${s.after.map(x => `<li>${hl(x)}</li>`).join('')}</ul></div>` : ''}
            </div>` : '', { short: 'Morning' }),
          B.add('🙋', 'How involved you actually are', suCards(s.involvement, 2),
            { short: 'How involved', count: s.involvement ? s.involvement.length + ' ways in' : '' }),
          B.add('❓', 'What to ask when you go and look', suTopics(s.visit, {
            offset: 3, open: 2, emos: ['❓', '🔍', '🗝️', '🧭', '👂', '🕰️', '📋', '🤝'],
            kicker: (x, i) => 'Question ' + String(i + 1).padStart(2, '0'),
            title: (x) => x.q, body: (x) => `<p class="su-d"><b>Why ask —</b> ${hl(x.why)}</p>`
          }), { short: 'Ask on a visit', count: s.visit ? s.visit.length + ' questions' : '', lead: 'Take these with you. Tap one to see what the answer tells you.' }),
          B.add('🚩', 'What should make you pause', s.flags ? `<ul class="su-nope">${s.flags.map(x => `<li>${hl(x)}</li>`).join('')}</ul>` : '',
            { short: 'Pause', count: s.flags ? s.flags.length + ' flags' : '' })
        ].join('');
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${B.nav()}
          ${blocks}
          ${s.note ? `<p class="note-box">${hl(s.note)}</p>` : ''}
        `;
      }
      const titles = {
        'core-idea': 'Core idea',
        'day-in-life': 'A day in the life',
        'activities': 'Things to do this week',
        'bring-it-home': 'Bring it home',
        'set-up-the-space': 'Set up the space',
        'running-it': 'Running the day',
        'your-part': 'Your part in it',
        'reading-list': 'Reading list',
        'competency': 'What to expect at four'
      };
      // The section's own title wins (e.g. "What to expect at 6–9"); the eyebrow
      // shows the stage so you always know which age you're reading.
      const heading = s.title || titles[key];
      const stageLabel = (STAGES.find(x => x.id === stage) || {}).sub;
      const eyebrow = `${m.name} · ${m.era}${(stage !== DEFAULT_STAGE && stageLabel) ? ' · ages ' + stageLabel : ''}`;

      // Open on a confident photo, like the homepage hero — not a dry title.
      const header = m.image
        ? `<div class="ed-shero">
             <img src="${m.image}" alt="">
             <div class="shero-in">
               <span class="shero-eyebrow">${eyebrow}</span>
               <h1 class="shero-title">${heading}</h1>
               <button class="read-btn ed-read" id="sub-read-btn">▶ Read aloud</button>
             </div>
           </div>`
        : `<header class="ed-sub-hero">
             <div class="ed-eyebrow">${eyebrow}</div>
             <h1 class="ed-title">${heading}</h1>
             <button class="read-btn ed-read" id="sub-read-btn">▶ Read aloud</button>
           </header>`;

      root.innerHTML = `
        <div class="ed-article">
          ${header}
          ${body}
        </div>
      `;
      window.scrollTo(0, 0);
      const readBtn = document.getElementById('sub-read-btn');
      if (readBtn) {
        readBtn.addEventListener('click', () => {
          if (window.Reader.speaking) window.Reader.stop();
          else window.Reader.readElement(document.getElementById('root'));
        });
      }
      // Activities quick-nav: a chip opens its topic drop-down and scrolls to it.
      document.querySelectorAll('.act-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const t = document.getElementById(chip.dataset.target);
          if (!t) return;
          t.open = true;
          t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      // Shopping list ticks — kept in localStorage so the list survives a trip
      // to the charity shop and a closed tab. Key is per tradition.
      const KIT_KEY = 'nb-kit';
      let kitGot = {};
      try { kitGot = JSON.parse(localStorage.getItem(KIT_KEY) || '{}'); } catch {}
      // "3 of 7 got" on each group's own bar — so a closed drop-down still
      // tells you where you are without opening it.
      const syncKitCounts = () => {
        document.querySelectorAll('.su-shopgroup').forEach((grp) => {
          const items = grp.querySelectorAll('.su-item');
          let got = 0;
          items.forEach((it) => { if (it.classList.contains('is-got')) got++; });
          const pill = grp.querySelector('.su-kit-count');
          if (pill) pill.textContent = got + ' of ' + items.length + ' got';
          grp.classList.toggle('is-done', items.length > 0 && got === items.length);
        });
      };
      document.querySelectorAll('.su-item').forEach((el) => {
        const id = el.dataset.kit;
        if (kitGot[id]) el.classList.add('is-got');
        el.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          e.preventDefault();
          const got = el.classList.toggle('is-got');
          if (got) kitGot[id] = 1; else delete kitGot[id];
          try { localStorage.setItem(KIT_KEY, JSON.stringify(kitGot)); } catch {}
          syncKitCounts();
        });
      });
      syncKitCounts();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
  <script src="assets/reader.js"></script>
  <script src="assets/theme.js"></script>
</body>
</html>
