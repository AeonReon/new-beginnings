<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4FA4D2">
  <title>Conscious Parenting NI — Tradition</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       EDITORIAL v2 — one cohesive theme, magazine reading experience.
       Cream-cool paper, navy ink, ONE blue accent, Fraunces display serif.
       Imagery + pull-quotes + whitespace do the work, not colour blocks.
       ════════════════════════════════════════════════════════════ */
    #root { --acc: #2D6FA8; --acc-bright: #4FA4D2; --acc-soft: #EAF3FB; --warm: #C77A22; --display: var(--serif); }

    /* Reading column — single, calm, ~680px */
    #root .ed-article { max-width: 680px; margin: 0 auto; padding-bottom: 2em; }

    /* Article furniture */
    #root .ed-eyebrow { font-family: var(--sans); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--acc); }
    #root .ed-title { font-family: var(--display); font-weight: 600; font-size: clamp(2.1rem, 8.5vw, 3rem); line-height: 1.03; letter-spacing: -0.02em; color: var(--ink); margin: 0.28em 0 0.24em; }
    #root .ed-deck { font-family: var(--sans); font-size: 1.2rem; line-height: 1.5; color: var(--ink-soft); font-weight: 500; margin: 0 0 1.3em; }

    /* Hero photo — large, confident, generous margin */
    #root .ed-hero { margin: 0.4em 0 0.7em; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-md); }
    #root .ed-hero img { width: 100%; display: block; aspect-ratio: 16 / 10; object-fit: cover; }

    /* Lead paragraph — drop cap, larger, inked */
    #root .ed-lead p { font-size: 1.15rem; line-height: 1.72; color: var(--ink); margin: 0 0 0.95em; }
    #root .ed-lead p:first-of-type::first-letter { font-family: var(--display); font-weight: 600; float: left; font-size: 3.5em; line-height: 0.7; margin: 0.07em 0.11em 0 0; color: var(--acc); }
    #root .ed-lead .lead { font-weight: 700; color: var(--ink); }
    #root .ed-lead-intro { margin-top: 0.4em; }

    /* Promise aside — a quiet framed panel, not a colour slab */
    #root .ed-promise { margin: 1.5em 0 0.5em; padding: 1.25em 1.4em; background: var(--acc-soft); border-radius: 16px; }
    #root .ed-promise-label { font-family: var(--sans); font-weight: 800; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--acc); margin-bottom: 0.45em; }
    #root .ed-promise-line { font-family: var(--display); font-weight: 600; font-size: 1.28rem; line-height: 1.3; color: var(--ink); margin: 0; }
    #root .ed-essence { list-style: none; padding: 0; margin: 0.95em 0 0; display: grid; gap: 0.55em; }
    #root .ed-essence li { position: relative; padding-left: 1.7em; font-size: 1rem; line-height: 1.45; color: var(--ink-soft); font-weight: 500; }
    #root .ed-essence li::before { content: ""; position: absolute; left: 0.15em; top: 0.5em; width: 0.7em; height: 0.4em; border-left: 2.5px solid var(--acc); border-bottom: 2.5px solid var(--acc); transform: rotate(-45deg); }

    /* Contents list ("Read on") — a magazine index, not chunky tiles */
    #root .ed-toc-head { font-family: var(--sans); font-weight: 800; font-size: 0.66rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-mute); margin: 2.2em 0 0.2em; }
    #root .ed-toc { border-top: 1px solid var(--rule); }
    #root .ed-toc .toc-row { display: flex; align-items: center; gap: 1em; padding: 1.05em 0.3em; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; transition: padding-left 0.16s ease, background 0.16s ease; }
    #root .ed-toc .toc-row:hover { background: var(--acc-soft); padding-left: 0.7em; border-radius: 10px; }
    #root .ed-toc .toc-no { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--acc); flex: 0 0 auto; width: 1.7em; }
    #root .ed-toc .toc-text { flex: 1; min-width: 0; }
    #root .ed-toc .toc-name { display: block; font-family: var(--display); font-weight: 600; font-size: 1.24rem; line-height: 1.15; color: var(--ink); }
    #root .ed-toc .toc-tag { display: block; font-size: 0.92rem; color: var(--ink-mute); margin-top: 0.15em; line-height: 1.35; }
    #root .ed-toc .toc-arrow { flex: 0 0 auto; color: var(--acc); font-weight: 700; font-size: 1.2rem; }
    #root .ed-toc .toc-soon { flex: 0 0 auto; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); background: var(--rule-soft); border-radius: 999px; padding: 0.3em 0.7em; }
    #root .ed-toc .toc-stub { opacity: 0.6; pointer-events: none; }

    /* Sub-section header */
    #root .ed-sub-hero { margin: 0.2em 0 1.2em; }
    #root .ed-sub-hero .ed-title { margin-top: 0.15em; }
    #root .read-btn.ed-read { margin-top: 1em; }

    /* ── Tenets — the points, as flowing article sections (NO boxes) ── */
    #root .tenet { padding: 1.9em 0 0.4em; border-top: 1px solid var(--rule); }
    #root .tenet:first-of-type { border-top: none; padding-top: 0.6em; }
    #root .tenet-no { font-family: var(--display); font-weight: 600; font-size: 1rem; color: var(--acc); letter-spacing: 0.04em; margin-bottom: 0.15em; }
    #root .tenet-kicker { font-family: var(--sans); font-weight: 700; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 0.35em; }
    #root .tenet-head { font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 6vw, 1.82rem); line-height: 1.12; letter-spacing: -0.015em; color: var(--ink); margin: 0 0 0.5em; }
    #root .tenet-take { font-size: 1.14rem; font-weight: 700; line-height: 1.42; color: var(--ink); margin: 0 0 0.75em; }
    #root .tenet-body p { font-size: 1.08rem; line-height: 1.74; color: var(--ink-soft); margin: 0 0 0.95em; }
    #root .tenet-body .lead { color: var(--ink); font-weight: 700; }
    /* "Why" — light, elegant, inline. Never a heavy coloured block. */
    #root .tenet-why { font-size: 0.99rem; line-height: 1.62; color: var(--ink-mute); margin: 0.2em 0 0; }
    #root .tenet-why span { font-family: var(--sans); font-weight: 800; font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acc); }
    /* "Try it" — one warm human accent, a hairline rule not a filled box */
    #root .tenet-try { font-size: 1.04rem; line-height: 1.55; color: var(--ink); border-left: 3px solid var(--warm); padding: 0.15em 0 0.15em 0.95em; margin: 1em 0 0.3em; }
    #root .tenet-try .tt-tag { font-family: var(--sans); font-weight: 800; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: var(--warm); border-radius: 999px; padding: 0.28em 0.6em; margin-right: 0.5em; vertical-align: 0.08em; }

    /* Feature pull-quote — the "something to look at" break between points */
    #root .pullquote { text-align: center; margin: 2.3em auto; padding: 0.4em 0; max-width: 15em; }
    #root .pullquote::before { content: "\201C"; display: block; font-family: var(--display); font-weight: 600; font-size: 4.5rem; line-height: 0.55; color: var(--acc); opacity: 0.28; margin-bottom: 0.12em; }
    #root .pullquote p { font-family: var(--display); font-weight: 500; font-style: italic; font-size: clamp(1.6rem, 6.5vw, 2rem); line-height: 1.26; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
    #root .pullquote cite { display: block; margin-top: 0.8em; font-family: var(--sans); font-style: normal; font-weight: 800; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--acc); }

    /* Closing recap — the one tasteful summary block */
    #root .recap { margin: 2.4em 0 0; padding: 1.4em 1.5em 1.5em; background: #fff; border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow-sm); }
    #root .recap-label { font-family: var(--sans); font-weight: 800; font-size: 0.64rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--acc); margin-bottom: 0.6em; }
    #root .recap ol { list-style: none; padding: 0; margin: 0; counter-reset: r; }
    #root .recap li { counter-increment: r; position: relative; padding: 0.65em 0 0.65em 2.1em; border-top: 1px solid var(--rule-soft); font-size: 1.03rem; line-height: 1.5; color: var(--ink); }
    #root .recap li:first-child { border-top: none; }
    #root .recap li::before { content: counter(r); position: absolute; left: 0; top: 0.62em; font-family: var(--display); font-weight: 600; font-size: 1.05rem; color: var(--acc); }

    /* ── Activities — grouped editorial list, number in its own gutter ── */
    #root .act-group { margin: 1.8em 0 0; }
    #root .act-group-head { display: flex; align-items: baseline; gap: 0.6em; font-family: var(--display); font-weight: 600; font-size: 1.32rem; letter-spacing: -0.015em; color: var(--ink); margin: 0 0 0.15em; padding-top: 1.4em; border-top: 1px solid var(--rule); }
    #root .act-group:first-of-type .act-group-head { border-top: none; padding-top: 0; }
    #root .act-group-kicker { font-family: var(--sans); font-weight: 800; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--acc); flex: 0 0 auto; }
    #root .act-group-intro { font-size: 1rem; line-height: 1.55; color: var(--ink-mute); margin: 0.15em 0 0.9em; }
    #root .act-list { }
    #root .act-item { display: flex; gap: 0.9em; padding: 0.85em 0; border-top: 1px solid var(--rule-soft); }
    #root .act-item:first-child { border-top: none; }
    #root .act-no { flex: 0 0 1.9em; width: 1.9em; height: 1.9em; border-radius: 999px; background: var(--acc-soft); color: var(--acc); font-family: var(--display); font-weight: 600; font-size: 0.98rem; display: grid; place-items: center; }
    #root .act-text { flex: 1; min-width: 0; }
    #root .act-name { font-family: var(--sans); font-weight: 800; font-size: 1.06rem; color: var(--ink); line-height: 1.25; margin: 0.15em 0 0.2em; }
    #root .act-body { font-size: 1rem; line-height: 1.6; color: var(--ink-soft); }

    /* ── legacy tradition-page styles (older sub-sections still use these) ── */
    #root mark.hl { background: linear-gradient(180deg, rgba(255,206,61,0) 58%, rgba(255,201,45,0.82) 58%); color: inherit; font-weight: 700; padding: 0 0.05em; border-radius: 2px; }
    #root .method-blurb { font-size: 1.05rem; line-height: 1.62; }

    /* Intro / lede — a strong opening block, not just a paragraph */
    /* Standfirst — a punchy magazine deck, in short lines with room to breathe */
    #root .lede { border-left: 4px solid var(--m-color); padding: 0.1em 0 0.1em 1.05em; margin: 0.3em 0 2em; }
    #root .lede p { font-family: var(--sans); font-weight: 600; font-size: 1.22rem; line-height: 1.5; color: var(--ink); letter-spacing: -0.01em; margin: 0 0 0.6em; }
    #root .lede p:last-child { margin-bottom: 0; }
    #root .lede::before { display: none; }
    #root .lead { color: var(--ink); font-weight: 800; }

    /* Sub-tiles → inviting horizontal cards with a gradient icon badge */
    #root .sub-tile-grid { display: grid; grid-template-columns: 1fr; gap: 0.75em; }
    @media (min-width: 700px) { #root .sub-tile-grid { grid-template-columns: 1fr 1fr; } }
    #root .sub-tile { flex-direction: row; align-items: center; gap: 0.95em; text-align: left; background: #fff; border-radius: 18px; padding: 0.9em 1.05em; min-height: 0; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
    #root .sub-tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: linear-gradient(135deg, var(--m-color), var(--m-deep)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.85; }
    #root .sub-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    #root .sub-tile-icon { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 15px; margin: 0; background: linear-gradient(150deg, var(--m-color), var(--m-deep)); display: grid; place-items: center; box-shadow: 0 4px 11px rgba(20,35,60,0.16), inset 0 1.5px 0 rgba(255,255,255,0.4); }
    #root .sub-tile-icon svg { width: 26px; height: 26px; color: #fff; }
    #root .sub-tile-text { flex: 1; min-width: 0; }
    #root .sub-tile-name { font-size: 1.06rem; font-weight: 800; color: var(--ink); margin: 0; }
    #root .sub-tile-tag { font-size: 0.84rem; color: var(--ink-mute); margin: 0.15em 0 0; }
    #root .sub-tile-arrow { flex: 0 0 auto; color: var(--m-color); font-weight: 800; font-size: 1.25rem; }
    #root .sub-tile-stub { opacity: 0.72; }

    /* Principle cards — number badge, gradient outline, WHY callout */
    /* Principle "points" — big faint number, bold hook, room to breathe */
    #root .principle-card { position: relative; overflow: hidden; background: #fff; border: none; border-radius: 18px; padding: 1.4em 1.4em 1.6em; margin: 0 0 1.15em; box-shadow: 0 2px 4px rgba(20,35,60,0.05), 0 14px 30px rgba(20,35,60,0.08); }
    /* Gentle rhythm — barely-there warm tint on alternate cards, never a wall of colour */
    #root .principle-card.alt { background: #fdfbf7; }
    #root .principle-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: linear-gradient(135deg, var(--m-color), var(--m-deep)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.5; }
    #root .principle-num { position: absolute; top: -0.16em; right: 0.12em; width: auto; height: auto; background: none; box-shadow: none; color: var(--m-color); opacity: 0.1; font: 900 4.4rem/1 var(--sans); letter-spacing: -0.05em; z-index: 0; }
    /* Card head — icon badge gives each card its own focal point */
    #root .pc-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 0.85em; margin: 0 0 0.7em; }
    #root .pc-icon { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(150deg, var(--m-color), var(--m-deep)); display: grid; place-items: center; box-shadow: 0 5px 13px color-mix(in srgb, var(--m-color) 40%, transparent), inset 0 1.5px 0 rgba(255,255,255,0.4); }
    #root .pc-icon svg { width: 26px; height: 26px; color: #fff; }
    #root .pc-head-text { flex: 1; min-width: 0; }
    /* Kicker — the plain principle name, small, above the hooky headline */
    #root .principle-kicker { position: relative; z-index: 1; font-family: var(--sans); font-weight: 800; font-size: 0.64rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--m-color); margin: 0 0 0.25em; }
    #root .pc-head-text h3 { margin: 0; }
    #root .principle-card h3 { position: relative; z-index: 1; margin: 0 0 0.4em; font-size: 1.28rem; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; line-height: 1.15; }
    /* Takeaway — the payoff line, stated before the body */
    #root .principle-take { position: relative; z-index: 1; margin: 0 0 0.7em; font-size: 1.06rem; font-weight: 800; line-height: 1.4; color: var(--m-deep); letter-spacing: -0.01em; }
    /* Try it — one scannable, concrete action */
    #root .in-practice { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 0.6em; background: var(--m-soft); border-radius: 12px; padding: 0.7em 0.9em; margin: 1em 0 0; font-size: 0.96rem; line-height: 1.5; color: var(--ink-soft); }
    #root .in-practice .ip-label { flex: 0 0 auto; font-weight: 800; font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: linear-gradient(150deg, var(--m-color), var(--m-deep)); border-radius: 999px; padding: 0.32em 0.62em; transform: translateY(-1px); }

    /* Belief banner — one saturated break in the middle of the scroll, a focal moment */
    #root .belief-banner { position: relative; overflow: hidden; margin: 1.9em 0; padding: 1.7em 1.5em 1.6em; border-radius: 20px; background: linear-gradient(145deg, var(--m-color), var(--m-deep)); box-shadow: 0 16px 34px color-mix(in srgb, var(--m-deep) 34%, transparent); }
    #root .belief-banner .bb-mark { position: absolute; top: -0.28em; right: 0.14em; font: 900 8rem/1 var(--serif); color: rgba(255,255,255,0.15); pointer-events: none; }
    #root .belief-banner p { position: relative; z-index: 1; margin: 0; color: #fff; font-family: var(--serif); font-style: italic; font-size: 1.5rem; font-weight: 500; line-height: 1.32; letter-spacing: -0.01em; max-width: 92%; }
    #root .belief-banner .bb-cite { position: relative; z-index: 1; margin-top: 0.8em; font-family: var(--sans); font-weight: 800; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.82); }

    /* Landing promise — the whole tradition in one breath + what's different */
    #root .method-promise { margin: 1.4em 0 0; padding: 1.15em 1.25em 1.2em; background: var(--m-soft); border-radius: 16px; position: relative; overflow: hidden; }
    #root .method-promise::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: linear-gradient(135deg, var(--m-color), var(--m-deep)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.55; }
    #root .method-promise .mp-eyebrow { font-weight: 800; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--m-color); margin-bottom: 0.4em; }
    #root .method-promise .mp-line { margin: 0; font-size: 1.14rem; font-weight: 800; line-height: 1.34; letter-spacing: -0.015em; color: var(--ink); }
    #root .essence-list { list-style: none; padding: 0; margin: 0.9em 0 0; display: grid; gap: 0.5em; }
    #root .essence-list li { position: relative; padding-left: 1.6em; font-size: 0.98rem; line-height: 1.45; color: var(--ink-soft); font-weight: 600; }
    #root .essence-list li::before { content: "✓"; position: absolute; left: 0; top: -0.02em; width: 1.15em; height: 1.15em; display: grid; place-items: center; font-size: 0.66em; font-weight: 900; color: #fff; background: linear-gradient(150deg, var(--m-color), var(--m-deep)); border-radius: 999px; }
    #root .pbody { position: relative; z-index: 1; }
    #root .pbody p { margin: 0 0 0.7em; line-height: 1.66; color: var(--ink-soft); font-size: 1.02rem; }
    #root .pbody p:last-child { margin-bottom: 0; }
    #root .pbody .lead { color: var(--ink); font-weight: 800; }

    /* WHY — a serif pull-quote, a change of pace from the body text */
    #root .why { position: relative; z-index: 1; background: none; border: none; border-left: 3px solid var(--m-color); border-radius: 0; padding: 0.1em 0 0.1em 1.05em; margin: 1.2em 0 0; font-family: var(--serif); font-style: italic; font-size: 1.1rem; line-height: 1.5; color: var(--m-deep); }
    #root .why::before { content: "Why it works"; display: block; font-family: var(--sans); font-style: normal; font-weight: 800; font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--m-color); margin-bottom: 0.35em; padding: 0; background: none; border-radius: 0; }
    #root .why::after { display: none; }

    /* Soft note box (day / competency notes, reading free line) */
    #root .note-box { background: var(--paper-warm, #fbf6ec); border: 1px solid var(--rule); border-radius: 12px; padding: 0.85em 1em; margin: 1.3em 0 0; font-size: 0.95em; line-height: 1.55; color: var(--ink-soft); }
    #root .note-box::before { content: "💡 "; }

    /* Day timeline — coloured time chips */
    #root .day-time { background: linear-gradient(150deg, var(--m-color), var(--m-deep)); color: #fff; font-weight: 800; border-radius: 999px; padding: 0.32em 0.72em; font-size: 0.78rem; display: inline-block; }
    #root .day-title { font-weight: 800; color: var(--ink); }
    #root .day-body { color: var(--ink-soft); line-height: 1.5; }

    /* Activity cards — badge + gradient outline, two-up on wider screens */
    #root .activity-grid { display: grid; grid-template-columns: 1fr; gap: 0.8em; }
    @media (min-width: 620px) { #root .activity-grid { grid-template-columns: 1fr 1fr; } }
    #root .activity-card { position: relative; background: #fff; border-radius: 14px; padding: 0.95em 1em 1em; box-shadow: var(--shadow-sm); }
    #root .activity-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: linear-gradient(135deg, var(--m-color), var(--m-deep)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.7; }
    #root .activity-num { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(150deg, var(--m-color), var(--m-deep)); color: #fff; font-weight: 800; font-size: 0.82rem; display: grid; place-items: center; margin: 0 0 0.4em; }
    #root .activity-name { font-weight: 800; color: var(--ink); margin: 0 0 0.25em; line-height: 1.2; }
    #root .activity-body { color: var(--ink-soft); line-height: 1.5; font-size: 0.93em; }

    /* Reading / competency lists — dot bullets in the tradition colour */
    #root .card > ul { list-style: none; padding: 0; margin: 0.5em 0 0; }
    #root .card > ul > li { position: relative; padding: 0.42em 0 0.42em 1.4em; border-top: 1px solid var(--rule); line-height: 1.5; color: var(--ink-soft); }
    #root .card > ul > li:first-child { border-top: none; }
    #root .card > ul > li::before { content: ""; position: absolute; left: 0.25em; top: 1em; width: 7px; height: 7px; border-radius: 50%; background: var(--m-color); }
    #root .card > ul.book-list > li { padding-left: 0; }
    #root .card > ul.book-list > li::before { display: none; }
    #root .book-note { color: var(--ink-mute); font-size: 0.9em; }
    #root .card h3 { color: var(--m-deep); }

    /* Room to rest, and magazine-style section subheads */
    #root > h2 { margin: 2.1em 0 0.5em; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--ink); }
    #root > h2::after { content: ""; display: block; width: 44px; height: 3px; border-radius: 3px; margin-top: 0.45em; background: linear-gradient(90deg, var(--m-color), var(--m-deep)); }
    #root > p { line-height: 1.62; margin: 0 0 0.6em; }
    #root .card { margin-bottom: 1.2em; padding: 1.2em 1.3em; }
    #root .card p { line-height: 1.6; }
    #root .day-block { margin-bottom: 1.2em; }
    #root .day-body { margin-top: 0.25em; }
    #root .activity-grid { gap: 1em; }
    #root .activity-card { padding: 1.05em 1.1em 1.1em; }
    #root .activity-body { line-height: 1.56; }
    #root .sub-tile-section { margin-top: 2.4em; }
    /* Landing blurb — short paragraphs, a drop cap, bold hook */
    #root .method-blurb { margin: 0.2em 0 0.4em; }
    #root .method-blurb p { font-size: 1.05rem; line-height: 1.66; color: var(--ink-soft); margin: 0 0 0.85em; }
    #root .method-blurb p:last-child { margin-bottom: 0; }
    #root .method-blurb p:first-child { color: var(--ink); }
    #root .method-blurb p:first-child::first-letter { font-size: 3em; font-weight: 800; float: left; line-height: 0.78; margin: 0.06em 0.12em 0 0; color: var(--m-deep); }
    #root .method-blurb .lead { color: var(--ink); font-weight: 800; }
    #root .sub-tile-section h2 { font-size: 1.32rem; letter-spacing: -0.02em; }
  </style>
</head>
<body class="method-page">
  <main id="root" class="method-main"></main>

  <script src="assets/methods-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const SUB_ICONS = {
      compass: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="4"/><polygon points="32,16 38,32 32,48 26,32" fill="currentColor"/>',
      sun: '<circle cx="32" cy="32" r="12" fill="currentColor"/><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><line x1="32" y1="8" x2="32" y2="16"/><line x1="32" y1="48" x2="32" y2="56"/><line x1="8" y1="32" x2="16" y2="32"/><line x1="48" y1="32" x2="56" y2="32"/><line x1="14" y1="14" x2="20" y2="20"/><line x1="44" y1="44" x2="50" y2="50"/><line x1="14" y1="50" x2="20" y2="44"/><line x1="44" y1="20" x2="50" y2="14"/></g>',
      hand: '<path d="M20 36 V22 a3 3 0 0 1 6 0 V32 V18 a3 3 0 0 1 6 0 V32 V20 a3 3 0 0 1 6 0 V34 V24 a3 3 0 0 1 6 0 V42 a14 14 0 0 1 -14 14 H26 a8 8 0 0 1 -8 -8 V40 a4 4 0 0 1 2 -4 Z" fill="currentColor"/>',
      book: '<rect x="14" y="14" width="36" height="40" rx="2" fill="currentColor"/><rect x="16" y="16" width="32" height="36" rx="1" fill="white"/><line x1="22" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="2.5"/><line x1="22" y1="32" x2="42" y2="32" stroke="currentColor" stroke-width="2.5"/><line x1="22" y1="40" x2="36" y2="40" stroke="currentColor" stroke-width="2.5"/>',
      sprout: '<path d="M32 54 V30" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M32 30 C 32 18 18 16 14 24 C 18 30 28 30 32 30 Z" fill="currentColor"/><path d="M32 30 C 32 22 46 18 50 24 C 46 30 36 30 32 30 Z" fill="currentColor" opacity="0.7"/>'
    };

    // A distinct glyph per principle — gives every card its own focal point so
    // the eye has a landmark instead of a wall of identical boxes.
    const PRINCIPLE_ICONS = {
      eye: '<path d="M6 32 C 14 20 26 16 32 16 C 38 16 50 20 58 32 C 50 44 38 48 32 48 C 26 48 14 44 6 32 Z" fill="currentColor" opacity="0.9"/><circle cx="32" cy="32" r="9" fill="#fff"/><circle cx="32" cy="32" r="4.5" fill="currentColor"/>',
      shelf: '<rect x="10" y="14" width="44" height="9" rx="2" fill="currentColor"/><rect x="10" y="28" width="44" height="9" rx="2" fill="currentColor" opacity="0.82"/><rect x="10" y="42" width="44" height="9" rx="2" fill="currentColor" opacity="0.64"/><rect x="15" y="16" width="8" height="5" rx="1" fill="#fff" opacity="0.55"/><rect x="15" y="30" width="8" height="5" rx="1" fill="#fff" opacity="0.55"/>',
      clock: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M32 20 V32 L42 38" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
      broom: '<line x1="42" y1="12" x2="26" y2="36" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M14 52 L26 32 L40 40 L28 56 Z" fill="currentColor"/><path d="M14 52 L28 56" stroke="#fff" stroke-width="2" opacity="0.5"/><path d="M20 46 L30 51 M24 41 L35 47" stroke="#fff" stroke-width="1.6" opacity="0.5"/>',
      puzzle: '<path d="M14 16 h14 a4 4 0 0 1 8 0 h14 v14 a4 4 0 0 0 0 8 v14 h-14 a4 4 0 0 0 -8 0 h-14 v-14 a4 4 0 0 1 0 -8 Z" fill="currentColor"/>',
      wave: '<path d="M8 28 Q 20 16 32 28 T 56 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M8 40 Q 20 28 32 40 T 56 40" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.6"/>',
      heart: '<path d="M32 52 C 12 38 10 24 20 18 C 27 14 32 20 32 24 C 32 20 37 14 44 18 C 54 24 52 38 32 52 Z" fill="currentColor"/>'
    };

    const SECTION_ORDER = ['core-idea', 'day-in-life', 'activities', 'reading-list', 'competency'];
    const SECTION_META = {
      'core-idea':   { n: '01', title: 'Core idea',            tag: 'The philosophy in plain language, with the why' },
      'day-in-life': { n: '02', title: 'A day in the life',    tag: 'What a typical day looks like for a four-year-old' },
      'activities':  { n: '03', title: 'Things to do this week', tag: 'Twenty activities — pick one or two a day' },
      'reading-list':{ n: '04', title: 'Reading list',         tag: 'Books for you, and books to read aloud' },
      'competency':  { n: '05', title: 'What to expect at four', tag: 'Landmarks at four — orientation, not a test' }
    };

    // Copywriter's marker — highlight the key idea in each block so the eye lands
    // on what matters instead of wading through a wall of text.
    const HL_TERMS = ['mastery-based', 'one-to-one', 'love of learning', 'growth mindset', 'the whole child', 'the prepared environment', 'living books', 'short lessons', 'follow the child', 'phonological awareness', 'working memory', 'fine motor', 'pincer grip', 'hand strength', 'self-control', 'problem-solving', 'out of doors', 'free play', 'two hours a day', 'top 1–2%', 'narration', 'mastery', 'independence', 'resilience', 'curiosity', 'wonder', 'limitless', 'imagination'].sort((a, b) => b.length - a.length);
    const HL_RE = new RegExp('(' + HL_TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    const hl = (str) => String(str == null ? '' : str).replace(HL_RE, '<mark class="hl">$1</mark>');
    // Bold a short opening HOOK — up to the first em-dash or sentence end.
    const leadHtml = (text) => {
      const s = String(text == null ? '' : text).trim();
      const m = s.match(/^([\s\S]{12,82}?)(\s—\s|[.!?]\s+)([\s\S]+)$/);
      if (!m) return hl(s);
      const dash = m[2].indexOf('—') !== -1;
      const leadText = dash ? m[1] : (m[1] + m[2].trim());
      const sep = dash ? m[2] : ' ';
      return '<span class="lead">' + hl(leadText) + '</span>' + sep + hl(m[3]);
    };
    // Break long text into short, breathing paragraphs (1–2 sentences each),
    // bolding the hook of the first one. This is what kills the "gray blob".
    const multiPara = (text, per) => {
      const s = String(text == null ? '' : text).trim();
      const sents = s.match(/[^.!?]+[.!?]+(?:["'”’)\]]*)(?:\s+|$)/g) || [s];
      per = per || 2;
      const groups = [];
      for (let i = 0; i < sents.length; i += per) groups.push(sents.slice(i, i + per).join('').trim());
      return groups.map((g, i) => i === 0 ? '<p>' + leadHtml(g) + '</p>' : '<p>' + hl(g) + '</p>').join('');
    };

    const id = new URLSearchParams(location.search).get('id') || 'charlotte-mason';
    const m = window.METHOD_BY_ID(id);
    const root = document.getElementById('root');

    if (!m) {
      root.innerHTML = '<h1>Tradition not found</h1><p><a href="index.html">← Back to home</a></p>';
    } else {
      // ONE cohesive theme across every tradition — the site's own clean blue,
      // not a different loud colour per school. Identity comes from the words and
      // the photo, not from drowning the page in a hue.
      const SITE = { accent: '#2D6FA8', accentBright: '#4FA4D2', accentSoft: '#EAF3FB', warm: '#E0912B' };
      document.title = 'Conscious Parenting NI — ' + m.name;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', SITE.accent);
      document.documentElement.style.setProperty('--m-color', SITE.accent);
      document.documentElement.style.setProperty('--m-deep', SITE.accent);
      document.documentElement.style.setProperty('--m-soft', SITE.accentSoft);

      const subSection = new URLSearchParams(location.search).get('s');

      if (subSection && m.sections && m.sections[subSection]) {
        // Back (top-left, added by app.js) uses browser history — from a
        // sub-section it returns to this tradition's landing, and from the
        // landing it returns to wherever you tapped in (the traditions grid).
        renderSubSection(m, subSection);
      } else {
        renderMethodLanding(m);
      }
    }

    function renderMethodLanding(m) {
      const toc = SECTION_ORDER.map(key => {
        const built = !!(m.sections && m.sections[key]);
        const meta = SECTION_META[key];
        return `
          <a class="toc-row${built ? '' : ' toc-stub'}" ${built ? `href="methodology.html?id=${m.id}&s=${key}"` : ''}>
            <span class="toc-no">${meta.n}</span>
            <span class="toc-text">
              <span class="toc-name">${meta.title}</span>
              <span class="toc-tag">${meta.tag}</span>
            </span>
            ${built ? '<span class="toc-arrow" aria-hidden="true">→</span>' : '<span class="toc-soon">Soon</span>'}
          </a>`;
      }).join('');

      root.innerHTML = `
        <article class="ed-article">
          <div class="ed-eyebrow">${m.era}</div>
          <h1 class="ed-title">${m.name}</h1>
          <p class="ed-deck">${m.tagline}</p>
          ${m.image ? `<figure class="ed-hero"><img src="${m.image}" alt="${m.name}"></figure>` : ''}
          <div class="ed-lead">${multiPara(m.blurb, 2)}</div>
          ${m.promise ? `
          <aside class="ed-promise">
            <div class="ed-promise-label">In one breath</div>
            <p class="ed-promise-line">${m.promise}</p>
            ${m.essence ? `<ul class="ed-essence">${m.essence.map(e => `<li>${e}</li>`).join('')}</ul>` : ''}
          </aside>` : ''}
          <div class="ed-toc-head">Read on</div>
          <nav class="ed-toc">${toc}</nav>
        </article>
      `;
    }

    function renderSubSection(m, key) {
      const s = m.sections[key];
      let body = '';

      if (key === 'core-idea') {
        const two = (n) => String(n).padStart(2, '0');
        // Spread the pull-quotes evenly through the piece so the eye gets a rest
        // between every couple of points, not one lump in the middle.
        const quotes = s.quotes || (s.banner ? [s.banner] : []);
        const n = s.principles.length;
        const quoteBefore = {};
        quotes.forEach((q, qi) => {
          const pos = Math.round((n * (qi + 1)) / (quotes.length + 1));
          quoteBefore[Math.min(Math.max(pos, 1), n - 1)] = q;
        });
        const pullquote = (q) => `<blockquote class="pullquote"><p>${q.text}</p>${q.cite ? `<cite>${q.cite}</cite>` : ''}</blockquote>`;
        const tenets = s.principles.map((p, i) => {
          const quote = quoteBefore[i] ? pullquote(quoteBefore[i]) : '';
          const head = p.hook
            ? `<div class="tenet-kicker">${p.name}</div><h3 class="tenet-head">${p.hook}</h3>`
            : `<h3 class="tenet-head">${p.name}</h3>`;
          return `${quote}
            <section class="tenet">
              <div class="tenet-no">${two(i + 1)}</div>
              ${head}
              ${p.takeaway ? `<p class="tenet-take">${hl(p.takeaway)}</p>` : ''}
              <div class="tenet-body">${multiPara(p.body, 2)}</div>
              ${p.why ? `<p class="tenet-why"><span>Why it works —</span> ${hl(p.why)}</p>` : ''}
              ${p.inPractice ? `<p class="tenet-try"><span class="tt-tag">Try it</span> ${hl(p.inPractice)}</p>` : ''}
            </section>`;
        }).join('');
        const recap = s.recap
          ? `<aside class="recap">
               <div class="recap-label">In short</div>
               <ol>${s.recap.map(r => `<li>${r}</li>`).join('')}</ol>
             </aside>`
          : '';
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${tenets}
          ${recap}
        `;
      } else if (key === 'day-in-life') {
        body = `
          <div class="lede">${multiPara(s.intro, 2)}</div>
          <div class="day-timeline">
            ${s.timeline.map(b => `
              <div class="day-block">
                <div class="day-time">${b.time}</div>
                <div class="day-content">
                  <div class="day-title">${b.title}</div>
                  <div class="day-body">${hl(b.body)}</div>
                </div>
              </div>
            `).join('')}
          </div>
          ${s.note ? `<p class="note-box">${hl(s.note)}</p>` : ''}
        `;
      } else if (key === 'activities') {
        // Grouped into themed clusters with subheads so a long list reads as a
        // handful of short chapters, not one endless column. Falls back to a
        // single flat group for traditions that haven't been grouped yet.
        const groups = s.groups || [{ items: s.items }];
        const item = (a, n) => `
          <div class="act-item">
            <div class="act-no">${n}</div>
            <div class="act-text">
              <div class="act-name">${a.name}</div>
              <div class="act-body">${hl(a.body)}</div>
            </div>
          </div>`;
        let n = 0;
        const midQuote = s.quote && groups.length > 2 ? Math.floor(groups.length / 2) : -1;
        const blocks = groups.map((g, gi) => {
          const head = g.heading
            ? `<div class="act-group-head"><span class="act-group-kicker">${String(gi + 1).padStart(2, '0')}</span>${g.heading}</div>${g.intro ? `<p class="act-group-intro">${hl(g.intro)}</p>` : ''}`
            : '';
          const rows = g.items.map(a => item(a, ++n)).join('');
          const brk = gi === midQuote ? `<blockquote class="pullquote"><p>${s.quote.text}</p>${s.quote.cite ? `<cite>${s.quote.cite}</cite>` : ''}</blockquote>` : '';
          return `<div class="act-group">${head}<div class="act-list">${rows}</div></div>${brk}`;
        }).join('');
        body = `
          <div class="ed-lead ed-lead-intro">${multiPara(s.intro, 2)}</div>
          ${blocks}
        `;
      } else if (key === 'reading-list') {
        body = `
          <div class="lede">${multiPara(s.intro, 2)}</div>
          <h2>For the child</h2>
          <p>${hl(s.forChild.intro)}</p>
          ${s.forChild.groups.map(g => `
            <div class="card">
              <h3>${g.heading}</h3>
              <ul>${g.books.map(b => `<li>${hl(b)}</li>`).join('')}</ul>
            </div>
          `).join('')}
          <h2>For the parent</h2>
          <p>${hl(s.forParent.intro)}</p>
          <div class="card">
            <ul class="book-list">
              ${s.forParent.books.map(b => `
                <li><strong>${b.title}</strong> — ${b.author}<br><span class="book-note">${hl(b.note)}</span></li>
              `).join('')}
            </ul>
          </div>
          ${s.free ? `<p class="note-box">${hl(s.free)}</p>` : ''}
        `;
      } else if (key === 'competency') {
        body = `
          <div class="lede">${multiPara(s.intro, 2)}</div>
          ${s.landmarks.map(area => `
            <div class="card">
              <h3>${area.area}</h3>
              <ul>${area.items.map(i => `<li>${hl(i)}</li>`).join('')}</ul>
            </div>
          `).join('')}
          ${s.note ? `<p class="note-box">${hl(s.note)}</p>` : ''}
        `;
      }

      const titles = {
        'core-idea': 'Core idea',
        'day-in-life': 'A day in the life',
        'activities': 'Things to do this week',
        'reading-list': 'Reading list',
        'competency': 'What to expect at four'
      };

      root.innerHTML = `
        <div class="ed-article">
          <header class="ed-sub-hero">
            <div class="ed-eyebrow">${m.name} · ${m.era}</div>
            <h1 class="ed-title">${titles[key]}</h1>
            <button class="read-btn ed-read" id="sub-read-btn">▶ Read aloud</button>
          </header>
          ${body}
        </div>
      `;
      window.scrollTo(0, 0);
      const readBtn = document.getElementById('sub-read-btn');
      if (readBtn) {
        readBtn.addEventListener('click', () => {
          if (window.Reader.speaking) window.Reader.stop();
          else window.Reader.readElement(document.getElementById('root'));
        });
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
  <script src="assets/reader.js"></script>
</body>
</html>
