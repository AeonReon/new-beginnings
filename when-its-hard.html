<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conscious Parenting NI — Turn It Around</title>
  <!-- Renamed to turn-it-around.html. Kept as a redirect because installed
       PWAs may still have the old URL in their cached home page. -->
  <meta http-equiv="refresh" content="0; url=turn-it-around.html">
  <link rel="canonical" href="turn-it-around.html">
  <script>(function(){try{var k="theme:"+location.pathname.split("/").slice(0,2).join("/"),t=localStorage.getItem(k);if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){}})();</script>
</head>
<body>
  <p><a href="turn-it-around.html">Turn It Around</a></p>
  <script>location.replace('turn-it-around.html');</script>
  <script src="assets/theme.js"></script>
</body>
</html>
