<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conscious Parenting NI — Turn It Around</title>
  <!-- Renamed to turn-it-around.html. Kept as a redirect because installed
       PWAs may still have the old URL in their cached home page. -->
  <meta http-equiv="refresh" content="0; url=turn-it-around.html">
  <link rel="canonical" href="turn-it-around.html">
  <meta name="theme-color" content="#2E84BD">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>(function(){try{var k="theme:"+location.pathname.split("/").slice(0,2).join("/"),t=localStorage.getItem(k);if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";var dark=t==="dark",m=document.querySelector('meta[name="theme-color"]');if(m)document.documentElement.setAttribute("data-chrome-light",m.getAttribute("content"));document.documentElement.setAttribute("data-theme",dark?"dark":"light");if(dark&&m)m.setAttribute("content","#12252F");}catch(e){}})();</script>
</head>
<body>
  <p><a href="turn-it-around.html">Turn It Around</a></p>
  <script>location.replace('turn-it-around.html');</script>
  <script src="assets/theme.js"></script>
</body>
</html>
