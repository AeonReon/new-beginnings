<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4FA4D2">
  <title>Conscious Parenting NI — This Week's Feast</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>(function(){try{var k="theme:"+location.pathname.split("/").slice(0,2).join("/"),t=localStorage.getItem(k);if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";var dark=t==="dark",m=document.querySelector('meta[name="theme-color"]');if(m)document.documentElement.setAttribute("data-chrome-light",m.getAttribute("content"));document.documentElement.setAttribute("data-theme",dark?"dark":"light");if(dark&&m)m.setAttribute("content","#12252F");}catch(e){}})();</script>
</head>
<body>
  <main>
    <header class="feast-hero">
      <div class="feast-hero-eyebrow"><span id="week-pill">Week 1</span></div>
      <h1>This Week's Feast</h1>
      <p class="lede">Seven small things to choose from this week — a poem, a hymn, a piece of music, a painting, a story, a nature prompt, a small piece of practical life. Do one. Do all. Do none. Then hit Next when you want a new one.</p>
    </header>

    <button id="read-btn" class="read-btn" style="margin-bottom: 1em;">▶ Read aloud</button>

    <div class="feast-drift" id="drift" hidden>
      <span id="driftMsg"></span>
      <span class="feast-drift-acts">
        <button type="button" class="secondary" id="driftBack">Back to this week</button>
        <button type="button" id="driftSet">Make this our week</button>
      </span>
    </div>

    <div id="feast-root"></div>

    <div class="feast-nav">
      <button class="secondary" id="prev">← Previous week</button>
      <button id="next">Next week →</button>
    </div>
  </main>

  <script src="assets/feast-data.js"></script>
  <script src="assets/path.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/reader.js"></script>
  <script>
    // The week comes from the Path — derived from the date the family began,
    // so it moves on its own. Prev/next only BROWSE the other 51 weeks; they
    // never quietly shift the family off their own week. "Make this our week"
    // is the one deliberate way to move the Path.
    let currentWeek = Path.week();

    document.getElementById('prev').addEventListener('click', () => {
      currentWeek = currentWeek > 1 ? currentWeek - 1 : 52;
      render();
    });
    document.getElementById('next').addEventListener('click', () => {
      currentWeek = currentWeek < 52 ? currentWeek + 1 : 1;
      render();
    });

    document.getElementById('driftBack').addEventListener('click', () => {
      currentWeek = Path.week();
      render();
    });
    document.getElementById('driftSet').addEventListener('click', () => {
      Path.goTo(currentWeek);
      render();
    });

    function renderDrift() {
      const bar = document.getElementById('drift');
      const real = Path.week();
      if (currentWeek === real) { bar.hidden = true; return; }
      document.getElementById('driftMsg').textContent =
        `You're looking at week ${currentWeek}. Your week is ${real}.`;
      bar.hidden = false;
    }

    function searchLinks(query) {
      const q = encodeURIComponent(query);
      return `
        <div class="links">
          <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Google</a>
          <a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube</a>
          <a href="https://www.gutenberg.org/ebooks/search/?query=${q}" target="_blank" rel="noopener">Gutenberg</a>
          <a href="https://librivox.org/search?q=${q}&search_form=advanced" target="_blank" rel="noopener">LibriVox</a>
        </div>
      `;
    }

    function section(title, kind, bodyHtml) {
      return `
        <div class="feast-section">
          <h3>${title} <span class="kind">${kind}</span></h3>
          ${bodyHtml}
        </div>
      `;
    }

    function render() {
      const w = currentWeek;
      const f = FEAST[w - 1];
      if (!f) return;

      const term = TERM_OF_WEEK(w);
      const composer = COMPOSER_OF_WEEK(w);
      const artist = ARTIST_OF_WEEK(w);
      const month = MONTH_OF_WEEK(w);
      const hymn = HYMNS[month];
      const virtue = VIRTUES[month];

      document.getElementById('week-pill').textContent =
        `Week ${w} · ${term.charAt(0).toUpperCase() + term.slice(1)} term` +
        (w === Path.week() ? ' · your week' : '');

      renderDrift();

      const root = document.getElementById('feast-root');

      const poemBody = f.poem.body
        ? `<div class="poem-body">${f.poem.body}</div>`
        : `<p><em>Text omitted (copyright or length). Find it in the sources below.</em></p>`;

      root.innerHTML = `
        <div class="virtue-card">
          <div class="virtue-eyebrow">This month's virtue</div>
          <div class="virtue-name">${virtue.name}</div>
          <p>${virtue.why}</p>
        </div>

        ${section(
          f.poem.title,
          `Poem · ${f.poem.author}`,
          `${poemBody}
           <p class="why">${f.poem.why}</p>
           ${searchLinks(f.poem.title + ' ' + f.poem.author)}`
        )}

        ${section(
          hymn.title,
          `Hymn`,
          `<p><em>${hymn.origin}</em></p>
           <p class="why">${hymn.note}</p>
           ${searchLinks(hymn.title + ' hymn')}`
        )}

        ${section(
          f.composer_piece.title,
          `Composer · ${composer.name}`,
          `<p>${f.composer_piece.note}</p>
           <p class="why">${composer.why}</p>
           ${searchLinks(composer.name + ' ' + f.composer_piece.title)}`
        )}

        ${section(
          f.artist_work.title,
          `Painting · ${artist.name}`,
          `<p>${f.artist_work.note}</p>
           <p class="why">${artist.why}</p>
           ${searchLinks(artist.name + ' ' + f.artist_work.title)}`
        )}

        ${section(
          f.story.title,
          `Story · ${f.story.kind} · ${f.story.source}`,
          `<p>${f.story.summary}</p>
           ${searchLinks(f.story.title + ' ' + f.story.source)}`
        )}

        ${section(
          f.nature.prompt,
          'Nature prompt',
          `<p class="why">${f.nature.why}</p>`
        )}

        ${section(
          f.practical_life.title,
          'Practical life',
          `<p class="why">${f.practical_life.why}</p>`
        )}
      `;
    }

    render();

    document.getElementById('read-btn').addEventListener('click', () => {
      if (window.Reader.speaking) {
        window.Reader.stop();
      } else {
        window.Reader.readElement(document.querySelector('main'));
      }
    });
  </script>
  <script src="assets/theme.js"></script>
</body>
</html>
